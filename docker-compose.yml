services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # nginx proxies /api/* to this host:port at runtime.
      # Defaults to "backend:8000" in the Dockerfile if not set.
      BACKEND_HOST: backend:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
