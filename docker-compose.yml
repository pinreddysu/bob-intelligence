services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # nginx proxies /api/* to this host:port at runtime.
      # Defaults to "backend:8000" in the Dockerfile if not set.
      BACKEND_HOST: backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
